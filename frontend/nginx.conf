# HSTS is only meaningful over HTTPS. This container speaks plain HTTP behind a TLS-terminating
# reverse proxy / platform (Caddy, Traefik, cloud LB...), which must set X-Forwarded-Proto: https.
# The header is emitted only for such requests, so local http://localhost use is unaffected.
map $http_x_forwarded_proto $mirsad_hsts {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

# WebSocket support for /api/v1/jobs/<id>/ws (live scan progress). Without the Upgrade headers
# nginx silently downgrades the socket and the UI falls back to HTTP polling.
# Keep the scheme the outer TLS proxy saw (if any) instead of always reporting plain http.
map $http_x_forwarded_proto $mirsad_fwd_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Rate limit for the unauthenticated OOB callback (2026-10-21).
limit_req_zone $binary_remote_addr zone=mirsad_oob:10m rate=10r/s;

server {
  listen 80;
  server_tokens off;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location = /health {
    proxy_pass http://backend:8000/health;
    proxy_set_header Host $host;
  }

  location = /readiness {
    proxy_pass http://backend:8000/readiness;
    proxy_set_header Host $host;
  }

  # Unauthenticated callback endpoint: small bodies only, rate limited.
  location /api/v1/oob/ {
    limit_req zone=mirsad_oob burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $mirsad_fwd_proto;
  }

  location /api/ {
    # Imports (nessus/nmap XML) accept up to 25MB; nginx's 1MB default would reject them with 413.
    client_max_body_size 26m;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $mirsad_fwd_proto;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
  }

  location /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-store" always;
  }
}
