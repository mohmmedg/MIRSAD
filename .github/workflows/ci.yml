name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Dependency vulnerability audit (pip-audit)
        working-directory: backend
        run: pip-audit -r requirements.txt

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check + build + frontend smoke tests
        working-directory: frontend
        run: npm test

      - name: Dependency vulnerability audit (npm audit)
        working-directory: frontend
        # لا نفشل الـ pipeline على تحذيرات low/moderate تلقائياً — فقط
        # high/critical توقف الـ CI. عدّل --audit-level حسب سياسة فريقك.
        run: npm audit --audit-level=high

  backend-docker-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build reproducible backend test image
        working-directory: backend
        run: docker build -f Dockerfile.test -t security-gemini-monster-backend-test .

      - name: Run backend tests in Docker
        run: docker run --rm security-gemini-monster-backend-test

  docker-e2e:
    runs-on: ubuntu-latest
    needs: [backend-tests-and-audit, frontend-audit]
    steps:
      - uses: actions/checkout@v4
      - name: Install curl
        run: sudo apt-get update && sudo apt-get install -y curl
      - name: Run Docker end-to-end smoke test
        run: ./scripts/docker-e2e.sh
